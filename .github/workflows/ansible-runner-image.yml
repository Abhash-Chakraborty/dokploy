# The image every Ansible run and restic job executes in. Dokploy pulls it
# on demand; it is never part of the Dokploy image.
name: ansible-runner image

on:
  push:
    branches: [main]
    paths: ["docker/abhash-ansible-runner/**", ".github/workflows/ansible-runner-image.yml"]
  workflow_dispatch:
  schedule:
    # Monthly rebuild, so the base image and its packages pick up fixes.
    - cron: "0 5 1 * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image names must be lowercase, and the owner's login is not.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dokploy-ansible-runner" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: docker/abhash-ansible-runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:2.19.3
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
