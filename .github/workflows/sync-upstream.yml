name: Sync Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write

env:
  PRODUCTION_BRANCH: main
  # Bot-owned scratch branch. It is recreated from main on every run, so it is
  # force-pushed and nothing should ever be committed to it by hand.
  SYNC_BRANCH: sync/upstream
  UPSTREAM_BRANCH: canary
  UPSTREAM_REMOTE: https://github.com/dokploy/dokploy.git

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PRODUCTION_BRANCH }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          set -euo pipefail
          git config user.name "abhash-dokploy-sync"
          git config user.email "actions@github.com"

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_REMOTE"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

      - name: Check for new upstream commits
        id: check
        run: |
          set -euo pipefail
          count=$(git rev-list --count "HEAD..upstream/$UPSTREAM_BRANCH")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Upstream commits not yet in $PRODUCTION_BRANCH: $count"
          if [ "$count" -eq 0 ]; then
            echo "Already up to date with \`upstream/$UPSTREAM_BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Merge, not rebase: the fork carries its own commits on top of upstream
      # and rewriting them nightly would make every sync PR a full-history diff.
      # A merge keeps the PR to just what upstream actually changed.
      - name: Merge upstream into a sync branch
        id: merge
        if: steps.check.outputs.count != '0'
        continue-on-error: true
        run: |
          set -euo pipefail
          git switch -c "$SYNC_BRANCH"
          git merge --no-edit "upstream/$UPSTREAM_BRANCH"

      - name: Report conflicts
        if: steps.merge.outcome == 'failure'
        run: |
          set -uo pipefail
          {
            echo "## Upstream sync hit conflicts"
            echo
            echo "Conflicting paths:"
            echo
            echo '```'
            git diff --name-only --diff-filter=U || true
            echo '```'
            echo
            echo "Resolve locally:"
            echo
            echo '```bash'
            echo "git remote add upstream $UPSTREAM_REMOTE   # once"
            echo "git fetch upstream $UPSTREAM_BRANCH"
            echo "git switch $PRODUCTION_BRANCH"
            echo "git merge upstream/$UPSTREAM_BRANCH"
            echo "# resolve, then:"
            echo "git add -A && git commit"
            echo "git push origin $PRODUCTION_BRANCH"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Upstream merge conflicted; see the job summary for the affected paths."
          exit 1

      - name: Push sync branch and open PR
        if: steps.merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$(git rev-list --count "origin/$PRODUCTION_BRANCH..HEAD")" -eq 0 ]; then
            echo "Merge produced no changes; nothing to promote." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Force-push is safe here: SYNC_BRANCH is recreated from main above and
          # exists only to carry this PR.
          git push --force origin "HEAD:refs/heads/$SYNC_BRANCH"

          existing=$(gh pr list \
            --head "$SYNC_BRANCH" \
            --base "$PRODUCTION_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          version=$(node -p "require('./apps/dokploy/package.json').version")

          if [ -n "$existing" ]; then
            echo "Refreshed existing PR #$existing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          url=$(gh pr create \
            --head "$SYNC_BRANCH" \
            --base "$PRODUCTION_BRANCH" \
            --title "Merge upstream dokploy ($UPSTREAM_BRANCH)" \
            --body "$(printf '%s\n' \
              "Merges \`dokploy/dokploy:$UPSTREAM_BRANCH\` into \`$PRODUCTION_BRANCH\`." \
              "" \
              "Fork version: \`$version\`" \
              "" \
              "Merging this publishes a new image through the Personal GHCR Release workflow.")")

          echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
