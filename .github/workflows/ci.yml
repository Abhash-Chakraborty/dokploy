name: CI

on:
  pull_request:
    branches: [main, development]
  # The nightly upstream sync dispatches this on its branch: PRs opened with
  # GITHUB_TOKEN do not trigger pull_request workflows.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: "pnpm"
      - run: node scripts/check-no-proprietary-imports.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@dokploy/server run typecheck
      - run: pnpm --filter=@dokploy/server run build
      - run: pnpm --filter=dokploy run typecheck
      # Suites that need a Docker daemon skip themselves; the rest run.
      - run: pnpm --filter=dokploy run test --run
      # Upstream keeps claiming the migration indices this fork uses. Catch a
      # broken snapshot chain or schema/migration drift here rather than at
      # container start.
      - name: Check migrations
        working-directory: apps/dokploy
        run: |
          pnpm exec drizzle-kit check --config ./server/db/drizzle.config.ts
          pnpm exec drizzle-kit generate --config ./server/db/drizzle.config.ts
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            git status --short -- drizzle
            echo "::error::Schema and migrations disagree; run pnpm migration:generate and commit the result."
            exit 1
          fi
          # Read the journal, not the directory: upstream ships an orphaned
          # 0130 file that no journal entry runs.
          dupes=$(node -p "require('./drizzle/meta/_journal.json').entries.map(e => e.tag.slice(0, 4)).join('\n')" | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration indices: $dupes"
            exit 1
          fi

  # DB-backed tests (role-binding engine, migrations) against a throwaway
  # Postgres service container.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dokploy
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dokploy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dokploy"
          --health-interval 2s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-retries 30
    env:
      DATABASE_URL: postgres://dokploy:ci@127.0.0.1:5432/dokploy
      SANDBOX_DATABASE_URL: postgres://dokploy:ci@127.0.0.1:5432/dokploy
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@dokploy/server run build
      - run: pnpm --filter=dokploy run migration:run
      # Applying twice proves the fork's migrations are idempotent.
      - run: psql "$DATABASE_URL" -c "DELETE FROM drizzle.__drizzle_migrations WHERE created_at > 1788995453103"
      - run: pnpm --filter=dokploy run migration:run
      - run: pnpm --filter=dokploy run test:integration

  # Builds the release image natively and boots it, so a bundler or Dockerfile
  # change cannot reach main unless the app really starts and serves its JS.
  image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Prepare env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dokploy:ci
          cache-from: type=gha,scope=dokploy-release-amd64
      - name: Boot and probe
        run: |
          set -euo pipefail
          docker network create ci
          docker run -d --name pg --network ci -e POSTGRES_USER=dokploy \
            -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=dokploy postgres:16
          docker run -d --name redis --network ci redis:7-alpine
          docker run -d --name app --network ci -p 3000:3000 \
            -e DATABASE_URL=postgres://dokploy:ci@pg:5432/dokploy \
            -e REDIS_URL=redis://redis:6379 \
            -e BETTER_AUTH_SECRET=ci-secret \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            dokploy:ci
          code=000
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            case "$code" in 200 | 302 | 307) break ;; esac
            sleep 3
          done
          docker logs --tail 40 app
          case "$code" in 200 | 302 | 307) ;; *) echo "::error::app did not start ($code)"; exit 1 ;; esac
          for path in /register /dashboard/home /api/trpc/settings.health; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$path")
            echo "$path -> $code"
          done
          # The client bundle must load, or every page is blank.
          js=$(curl -s http://localhost:3000/register | grep -oE '/_next/static/[^"]+\.js' | head -1)
          [ -n "$js" ] || { echo "::error::no script in /register"; exit 1; }
          curl -sf -o /dev/null "http://localhost:3000$js"
          echo "client bundle ok: $js"
